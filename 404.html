<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aura Destination Management - Destination Not Found">
    <title>404 Destination Not Found | Aura Destination Management</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css?v=3">
    <link rel="stylesheet" href="assets/css/candy.css">

    <style>
        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: #FAF8F5;
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <div style="max-width: 550px;">
            <i class="fa-solid fa-compass" style="font-size: 5rem; color: #00A896; margin-bottom: 20px; animation: spin 10s infinite linear;"></i>
            <h1 style="font-size: 5rem; font-family: 'Playfair Display', serif; color: #0B192C; margin: 0;">404</h1>
            <h2 style="font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #0B192C; margin: 10px 0;">Destination Not Found</h2>
            <p style="color: #64748B; font-size: 1rem; line-height: 1.6; margin-bottom: 30px;">It looks like the route or page you are looking for has been moved or doesn't exist. Let's get your itinerary back on track.</p>

            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button onclick="window.history.back()" class="btn-candy" style="padding: 12px 25px; background: linear-gradient(135deg, #00A896, #028090); border-color: #00A896; cursor: pointer;"><i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Go Back</button>
                <a href="index.html" class="btn-candy" style="padding: 12px 25px;"><i class="fa-solid fa-house" style="margin-right: 8px;"></i> Return Home</a>
            </div>
        </div>
    </div>

</body>
